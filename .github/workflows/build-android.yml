name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Устанавливаем все нужные пакеты принудительно, чтобы не падать из-за package.json
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D vite @capacitor/cli
          npm install @capacitor/core @capacitor/android

      # Собираем веб-файлы через vite
      - name: Build web assets
        run: npx vite build

      # Синхронизируем нативный Android
      - name: Sync Capacitor
        run: npx cap sync android

      # Даем права на выполнение градлу и собираем APK
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Загружаем готовый APK в артефакты
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: findly-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
